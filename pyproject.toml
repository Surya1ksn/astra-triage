[project]
name = "astra-triage"
version = "0.1.0"
description = "AI-assisted support ticket triage (practice assessment scaffold)"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["stage4/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]  # S = bandit-style security rules
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is pytest's own assertion mechanism, not a real risk in
# test code -- standard practice is to exclude test dirs, not rewrite tests.
"stage4/tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py310"]
